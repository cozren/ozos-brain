<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cyberpunk Neural Brain</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three":          "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":  "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE          from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════════════════════════════════════════════════════════════
//  SCENE / CAMERA / RENDERER
// ═══════════════════════════════════════════════════════════════════════════
const W = window.innerWidth, H = window.innerHeight;
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 50);
camera.position.set(0.8, 0.4, 4.5);
camera.lookAt(0, 0.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ReinhardToneMapping;
document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════════════════════════════════════
//  BLOOM POST-PROCESSING
//  Low threshold so even the dim cyan wires get a soft halo.
//  Bright white particles/pulse nodes get intense bloom.
// ═══════════════════════════════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W, H),
  1.35,  // strength
  0.50,  // radius
  0.07   // threshold
);
composer.addPass(bloomPass);

// ═══════════════════════════════════════════════════════════════════════════
//  BRAIN SURFACE — RADIAL FUNCTION
//  r(theta, phi): distance from origin to the brain surface at that angle.
//  Coord system: +Y = top/crown, +X = frontal lobe, +Z = right hemisphere.
// ═══════════════════════════════════════════════════════════════════════════
function brainR(theta, phi) {
  const cosT = Math.cos(theta), sinT = Math.sin(theta);
  const cosP = Math.cos(phi),   sinP = Math.sin(phi);

  // Base ellipsoid — brain proportions (front-back longest, L-R narrowest)
  const ax = 1.52, ay = 1.00, az = 0.88;
  const ex = (sinT * cosP) / ax, ey = cosT / ay, ez = (sinT * sinP) / az;
  let r = 1.0 / Math.sqrt(ex * ex + ey * ey + ez * ez);

  // Inferior flattening (flat base)
  if (cosT < 0) r *= 1.0 + 0.42 * cosT;

  // Frontal lobe bulge
  r += 0.07 * Math.max(0, cosP) * sinT * (1.0 - theta / Math.PI);
  // Occipital prominence
  r += 0.06 * Math.max(0, -cosP) * Math.pow(sinT, 0.8);
  // Parietal elevation (high dome)
  r += 0.05 * Math.exp(-7.0 * (theta - 0.25 * Math.PI) ** 2);

  // Temporal lobe protrusion (lower-lateral, both sides)
  const dTa = phi - Math.PI / 3.5, dTb = phi - (2 * Math.PI - Math.PI / 3.5);
  r += 0.045 * (Math.exp(-5 * dTa ** 2) + Math.exp(-5 * dTb ** 2))
             * Math.exp(-10 * (theta - 0.64 * Math.PI) ** 2);

  // Sylvian fissure — lateral indentation
  r -= 0.13 * Math.exp(-9 * (theta - 0.56 * Math.PI) ** 2) * sinP * sinP;

  // Gyri — multi-frequency surface undulation
  r += 0.080 * Math.sin(4.6  * theta + 1.7) * Math.cos(3.9  * phi + 0.8);
  r += 0.055 * Math.sin(7.4  * theta - 1.1) * Math.cos(6.7  * phi + 2.5);
  r += 0.038 * Math.sin(10.8 * theta + 2.0) * Math.cos(3.2  * phi - 1.2);
  r += 0.025 * Math.sin(3.2  * theta + 4.8) * Math.cos(10.5 * phi + 0.4);
  r += 0.015 * Math.sin(14.0 * theta - 0.7) * Math.cos(5.1  * phi + 3.6);
  r += 0.010 * Math.sin(6.5  * theta + 3.1) * Math.cos(8.3  * phi - 0.9);

  return r;
}

// ═══════════════════════════════════════════════════════════════════════════
//  SURFACE POINT SAMPLING  (Poisson-style min-distance culling)
// ═══════════════════════════════════════════════════════════════════════════
function sampleSurface(target) {
  const pts = [], MIN_D = 0.110, MAX = target * 30;
  for (let n = 0; n < MAX && pts.length < target; n++) {
    const theta = Math.acos(2 * Math.random() - 1);
    const phi   = Math.random() * Math.PI * 2;
    if (theta > Math.PI * 0.81) continue;
    const r = brainR(theta, phi), st = Math.sin(theta);
    const p = new THREE.Vector3(r * st * Math.cos(phi), r * Math.cos(theta), r * st * Math.sin(phi));
    let ok = true;
    for (const q of pts) { if (p.distanceTo(q) < MIN_D) { ok = false; break; } }
    if (ok) pts.push(p);
  }
  return pts;
}

// ═══════════════════════════════════════════════════════════════════════════
//  GRAPH — k-nearest-neighbour edges (Obsidian-style)
// ═══════════════════════════════════════════════════════════════════════════
function buildGraph(pts) {
  const SHORT = 0.32, LONG = 0.68, K_S = 5, K_L = 2;
  const shortEdges = [], longEdges = [], seen = new Set();
  for (let i = 0; i < pts.length; i++) {
    const nbrs = [];
    for (let j = 0; j < pts.length; j++) {
      if (i === j) continue;
      const d = pts[i].distanceTo(pts[j]);
      if (d < LONG) nbrs.push({ j, d });
    }
    nbrs.sort((a, b) => a.d - b.d);
    let ks = 0, kl = 0;
    for (const { j, d } of nbrs) {
      const key = i < j ? `${i},${j}` : `${j},${i}`;
      if (seen.has(key)) continue;
      if (d <= SHORT && ks < K_S) { shortEdges.push({ a: i, b: j }); seen.add(key); ks++; }
      else if (d <= LONG && kl < K_L) { longEdges.push({ a: i, b: j }); seen.add(key); kl++; }
    }
  }
  return { shortEdges, longEdges };
}

// Per-node edge list for packet traversal + BFS
function buildAdjacency(allEdges, n) {
  const adj = Array.from({ length: n }, () => []);
  allEdges.forEach(({ a, b }, ei) => {
    adj[a].push({ ei, other: b });
    adj[b].push({ ei, other: a });
  });
  return adj;
}

// ═══════════════════════════════════════════════════════════════════════════
//  BUILD THE BRAIN
// ═══════════════════════════════════════════════════════════════════════════
const points               = sampleSurface(500);
const { shortEdges, longEdges } = buildGraph(points);
const allEdges             = [...shortEdges, ...longEdges];
const adj                  = buildAdjacency(allEdges, points.length);
const N_NODES              = points.length;

const brainGroup = new THREE.Group();
scene.add(brainGroup);

// ── Layer B: Wire mesh ────────────────────────────────────────────────────
function makeLines(edges, color, opacity) {
  const pos = new Float32Array(edges.length * 6);
  edges.forEach(({ a, b }, i) => {
    const A = points[a], B = points[b];
    pos.set([A.x, A.y, A.z, B.x, B.y, B.z], i * 6);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.LineSegments(geo,
    new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
}
brainGroup.add(makeLines(shortEdges, 0x00e5ff, 0.42));
brainGroup.add(makeLines(longEdges,  0x00e5ff, 0.14));

// ═══════════════════════════════════════════════════════════════════════════
//  LIVE PARTICLE LAYER  (nodes + data packets, single GPU draw call)
//  Layout: [0 … N_NODES-1] = brain nodes | [N_NODES … N_TOTAL-1] = packets
// ═══════════════════════════════════════════════════════════════════════════
const N_PACKETS = 220;
const N_TOTAL   = N_NODES + N_PACKETS;

const livePos = new Float32Array(N_TOTAL * 3);
const liveSz  = new Float32Array(N_TOTAL);
const liveCol = new Float32Array(N_TOTAL * 3);

// Initialise static node positions + resting appearance
for (let i = 0; i < N_NODES; i++) {
  const p = points[i];
  livePos.set([p.x, p.y, p.z], i * 3);
  liveSz[i] = 1.0;
  liveCol.set([0.0, 0.82, 1.0], i * 3);  // resting: dim cyan
}
// Initialise packet appearance (positions filled on first update)
for (let pi = 0; pi < N_PACKETS; pi++) {
  liveSz[N_NODES + pi] = 1.6;
  liveCol.set([0.65, 0.96, 1.0], (N_NODES + pi) * 3);  // bright cyan-white
}

const liveGeo = new THREE.BufferGeometry();
const posAttr  = new THREE.BufferAttribute(livePos, 3);
const szAttr   = new THREE.BufferAttribute(liveSz,  1);
const colAttr  = new THREE.BufferAttribute(liveCol, 3);
posAttr.setUsage(THREE.DynamicDrawUsage);
szAttr.setUsage(THREE.DynamicDrawUsage);
colAttr.setUsage(THREE.DynamicDrawUsage);
liveGeo.setAttribute('position', posAttr);
liveGeo.setAttribute('aSize',    szAttr);
liveGeo.setAttribute('aColor',   colAttr);

// Custom shader: per-vertex size + soft circular dot + additive blending
const liveMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3  aColor;
    varying   vec3  vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (22.0 / -mv.z);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float alpha = 1.0 - smoothstep(0.3, 1.0, d);
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent : true,
  depthWrite  : false,
  blending    : THREE.AdditiveBlending,
});

brainGroup.add(new THREE.Points(liveGeo, liveMat));

// ═══════════════════════════════════════════════════════════════════════════
//  PASSIVE PACKET SYSTEM
//  Each packet travels node-to-node along the graph.
//  On arrival it picks a random connected edge and continues.
// ═══════════════════════════════════════════════════════════════════════════
const packets = Array.from({ length: N_PACKETS }, () => {
  const e = allEdges[Math.floor(Math.random() * allEdges.length)];
  return { nodeA: e.a, nodeB: e.b, t: Math.random(), speed: 0.004 + Math.random() * 0.008 };
});

function updatePackets() {
  for (let pi = 0; pi < N_PACKETS; pi++) {
    const pk = packets[pi];
    pk.t += pk.speed;

    if (pk.t >= 1.0) {
      const nbrs = adj[pk.nodeB];
      if (nbrs.length > 0) {
        const nx = nbrs[Math.floor(Math.random() * nbrs.length)];
        pk.nodeA = pk.nodeB;
        pk.nodeB = nx.other;
      } else {
        const e = allEdges[Math.floor(Math.random() * allEdges.length)];
        pk.nodeA = e.a; pk.nodeB = e.b;
      }
      pk.t    = 0;
      pk.speed = 0.004 + Math.random() * 0.008;
    }

    const A = points[pk.nodeA], B = points[pk.nodeB];
    const off = (N_NODES + pi) * 3;
    livePos[off]     = A.x + (B.x - A.x) * pk.t;
    livePos[off + 1] = A.y + (B.y - A.y) * pk.t;
    livePos[off + 2] = A.z + (B.z - A.z) * pk.t;
  }
  posAttr.needsUpdate = true;
}

// ═══════════════════════════════════════════════════════════════════════════
//  SYNAPTIC PULSE CASCADE
//  Every 5-9 seconds a cluster of posterior-inferior nodes fires.
//  A BFS wave propagates forward through the network — nodes flare bright
//  white then fade back to resting cyan.
// ═══════════════════════════════════════════════════════════════════════════
const HOP_MS  = 400;   // wave travels 1 graph-hop per this many ms
const RAMP_MS = 220;   // ramp-up time to peak brightness
const HOLD_MS = 200;   // sustained peak
const FADE_MS = 1200;  // fade-out after peak

let pulseActive    = false;
let pulseStart     = 0;
let pulseDist      = null;    // BFS distance per node (9999 = unreachable)
let pulseMaxDist   = 1;
let sinceLastPulse = 0;
let nextPulseIn    = 2500;    // ms until first pulse

function triggerPulse(now) {
  pulseActive = true;
  pulseStart  = now;

  // Source cluster: posterior-inferior nodes (high-Y-inv, occipital region)
  const ranked = points
    .map((p, i) => ({ i, score: -p.y - p.x * 0.6 }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 22);
  const sources = ranked.sort(() => Math.random() - 0.5).slice(0, 4).map(x => x.i);

  pulseDist = new Float32Array(N_NODES).fill(9999);
  sources.forEach(n => { pulseDist[n] = 0; });

  const queue = [...sources];
  let h = 0;
  while (h < queue.length) {
    const n = queue[h++];
    for (const { other } of adj[n]) {
      if (pulseDist[other] >= 9999) {
        pulseDist[other] = pulseDist[n] + 1;
        queue.push(other);
      }
    }
  }

  pulseMaxDist = 0;
  for (let i = 0; i < N_NODES; i++) {
    if (pulseDist[i] < 9999) pulseMaxDist = Math.max(pulseMaxDist, pulseDist[i]);
  }
}

function updatePulse(now) {
  const elapsed = now - pulseStart;
  let   anyAlive = false;

  for (let i = 0; i < N_NODES; i++) {
    const d = pulseDist[i];
    if (d >= 9999) continue;  // unreachable node — stays resting

    const activateAt = d * HOP_MS;
    const t          = elapsed - activateAt;

    let activation = 0;
    if      (t >= 0 && t < RAMP_MS)              activation = t / RAMP_MS;
    else if (t >= RAMP_MS && t < RAMP_MS + HOLD_MS) activation = 1.0;
    else if (t >= RAMP_MS + HOLD_MS)              activation = 1.0 - (t - RAMP_MS - HOLD_MS) / FADE_MS;

    activation = Math.max(0, Math.min(1, activation));
    if (activation > 0) anyAlive = true;

    // Size: 1.0 (rest) → 5.5 (peak flare)
    liveSz[i] = 1.0 + activation * 4.5;

    // Colour: dim cyan → near-white at peak
    liveCol[i * 3]     = activation * 0.75;           // R 0→0.75
    liveCol[i * 3 + 1] = 0.82 + activation * 0.18;    // G 0.82→1.0
    liveCol[i * 3 + 2] = 1.0;                          // B always 1
  }

  szAttr.needsUpdate  = true;
  colAttr.needsUpdate = true;

  // Check if cascade is complete
  const totalDur = pulseMaxDist * HOP_MS + RAMP_MS + HOLD_MS + FADE_MS;
  if (elapsed > totalDur) {
    pulseActive = false;
    // Reset all nodes to resting state
    for (let i = 0; i < N_NODES; i++) {
      liveSz[i] = 1.0;
      liveCol.set([0.0, 0.82, 1.0], i * 3);
    }
    szAttr.needsUpdate  = true;
    colAttr.needsUpdate = true;
    nextPulseIn = 5000 + Math.random() * 4000;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  MOUSE PARALLAX
//  Mouse left  → lateral profile (Image 0 angle)
//  Mouse right → rotated showing 3-D depth (Image 4 angle)
// ═══════════════════════════════════════════════════════════════════════════
const MAX_ROT_Y = 0.30, MAX_ROT_X = 0.18, DAMPING = 0.07;
let targetY = 0, targetX = 0, currentY = 0, currentX = 0;

window.addEventListener('mousemove', e => {
  targetY = ((e.clientX / window.innerWidth)  * 2 - 1) *  MAX_ROT_Y;
  targetX = ((e.clientY / window.innerHeight) * 2 - 1) *  MAX_ROT_X;
});
window.addEventListener('mouseleave', () => { targetY = 0; targetX = 0; });

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════════
let lastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);

  const dt = now - lastTime;
  lastTime = now;

  // 1. Passive data-packet flow
  updatePackets();

  // 2. Synaptic pulse trigger + cascade
  sinceLastPulse += dt;
  if (!pulseActive && sinceLastPulse > nextPulseIn) {
    triggerPulse(now);
    sinceLastPulse = 0;
  }
  if (pulseActive) updatePulse(now);

  // 3. Mouse parallax — smooth lerp
  currentY += (targetY - currentY) * DAMPING;
  currentX += (targetX - currentX) * DAMPING;
  brainGroup.rotation.y = currentY;
  brainGroup.rotation.x = currentX;

  // 4. Render with bloom
  composer.render();
}

requestAnimationFrame(animate);

// ═══════════════════════════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  const W = window.innerWidth, H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  composer.setSize(W, H);
  bloomPass.resolution.set(W, H);
});
</script>
</body>
</html>
